name: CI

# Lints and tests both halves of the app on every push/PR. Free on GitHub for
# public repos, and covered by the free included minutes for private repos on
# GitHub's free/Pro plans for typical usage.
#
# Both the backend (backend/) and frontend (frontend/) are being built out in
# parallel and are very early-stage at the time this workflow was written
# (backend has an app/ package + requirements.txt but no tests yet; frontend
# has no package.json yet). Steps below are written defensively (checked
# existence, --if-present, tolerant of "no tests collected") so this workflow
# stays green during that build-out instead of hard-failing on missing
# scaffolding - tighten it (remove the tolerances) once both sides have real
# tests.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # Exit code 5 = "no tests collected" - expected while backend/tests
        # is still being built out; don't fail CI on that specific case, but
        # do fail on real test failures/errors (any other non-zero code).
        run: |
          pytest -q
          status=$?
          if [ $status -ne 0 ] && [ $status -ne 5 ]; then
            exit $status
          fi

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend scaffold exists
        id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::frontend/package.json not found yet - skipping frontend build/lint. Re-check this workflow once the frontend scaffold lands."
          fi

      - uses: actions/setup-node@v4
        if: steps.scaffold.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.scaffold.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.scaffold.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.scaffold.outputs.exists == 'true'
        run: npm run build --if-present
